services:
  wallet-init:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_NAME: wallet
      MYSQL_PWD: root
    volumes:
      - ./docker/migrate.sh:/bootstrap/migrate.sh:ro
      - ./migrations/wallet:/migrations:ro
    entrypoint: ["bash", "/bootstrap/migrate.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  balances-init:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      DB_HOST: balances-db
      DB_USER: balances
      DB_NAME: balances
      MYSQL_PWD: balances
    volumes:
      - ./docker/migrate.sh:/bootstrap/migrate.sh:ro
      - ./migrations/balances:/migrations:ro
    entrypoint: ["bash", "/bootstrap/migrate.sh"]
    depends_on:
      balances-db:
        condition: service_healthy

  balances:
    build:
      context: .
      dockerfile: balances/Dockerfile
    platform: linux/amd64
    restart: on-failure
    ports:
      - 3003:3003
    environment:
      BALANCES_DB_DSN: balances:balances@tcp(balances-db:3306)/balances?parseTime=true
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: balances-service
    depends_on:
      balances-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully

  balances-db:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: balances
      MYSQL_USER: balances
      MYSQL_PASSWORD: balances
    volumes:
      - balances-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-ubalances", "-pbalances", "balances", "-e", "SELECT 1;"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  kafka-init:
    image: confluentinc/cp-enterprise-kafka:6.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["kafka-topics"]
    command: ["--bootstrap-server", "kafka:29092", "--create", "--if-not-exists", "--topic", "balances", "--partitions", "1", "--replication-factor", "1"]

  goapp: 
    build: .
    platform: linux/amd64
    depends_on:
      wallet-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - 8080:8080

  mysql:
    image: mysql:5.7
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wallet
      MYSQL_PASSWORD: root
    ports:
      - 3307:3306
    volumes:
      - .docker/mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-uroot", "-proot", "wallet", "-e", "SELECT 1;"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  zookeeper:
    image: "confluentinc/cp-zookeeper:6.1.0"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    container_name: zookeeper
    ports:
      - 2181:2181
    environment:
      TZ: Sao_Paulo/Brazil
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: "confluentinc/cp-enterprise-kafka:6.1.0"
    volumes:
      - kafka-data:/var/lib/kafka/data
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
    # Exposes 9092 for external connections to the broker
    # Use kafka:29092 for connections internal on the docker network
    # See https://rmoff.net/2018/08/02/kafka-listeners-explained/ for details
      - '9092:9092'
    environment:
      TZ: Sao_Paulo/Brazil
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 100
      CONFLUENT_METRICS_ENABLE: 'false'
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.3.0
    hostname: control-center
    container_name: control-center
    depends_on:
      - kafka
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

volumes:
  balances-data:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
